# remap prefix from 'C-b' to 'C-z'
set    -g prefix C-z
unbind C-b

# no escape delay, long repeat time
set -sg escape-time 0
set -sg repeat-time 1500

# one based indices, renumber on close
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on

# True colour
set -g  default-terminal   'tmux-256color'
set -ga terminal-overrides ',xterm*:Tc'  # Override term running outside tmux to support true colour

# SSH environment vars
set -g update-environment "SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION DISPLAY"

# Mouse mode - scrolling https://github.com/tmux/tmux/issues/145#issuecomment-150736967
setw -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send -M" "if -Ft= '#{pane_in_mode}' 'send -M' 'copy-mode -e'"
# bind -n C-u if-shell "[[ #{pane_current_command} == 'zsh' ]]" "copy-mode -e" "send C-u"

# Status
setw -g status-left-length 60
setw -g status-right-length 100
set  -g status-right '#[fg=green]#(task active rc.verbose=nothing rc.report.active.columns=description rc.report.active.labels=D rc.color=off)#[default] #h #[fg=red]%a %e %b %R'
set  -g status-interval 1
setw -g monitor-activity on
set  -g visual-activity off

# Quick navigate between panes
#   https://github.com/christoomey/vim-tmux-navigator/issues/295#issuecomment-1123455337
bind -n C-h if-shell -F "#{@is_vim}" "send-keys C-h"  "select-pane -L"
bind -n C-j if-shell -F "#{@is_vim}" "send-keys C-j"  "select-pane -D"
bind -n C-k if-shell -F "#{@is_vim}" "send-keys C-k"  "select-pane -U"
bind -n C-l if-shell -F "#{@is_vim}" "send-keys C-l"  "select-pane -R"
bind -n C-\\ if-shell -F "#{@is_vim}" "send-keys C-\\" "select-pane -l"

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi C-\\ select-pane -l

# Use Alt-vim keys without prefix key to switch windows/clients
bind -n M-h previous-window
bind -n è   previous-window
bind -n ˙   previous-window
bind -n M-l next-window
bind -n ì   next-window
bind -n ¬   next-window

bind -n M-j switch-client -l
bind -n ê   switch-client -l
bind -n π   switch-client -l
bind -n M-k switch-client -n
bind -n ë   switch-client -n
bind -n ˚   switch-client -n
bind -n M-p switch-client -p
bind -n ð   switch-client -p
bind -n ∆   switch-client -p

# Tmuxinator
bind -n ç if-shell "tmux ls | grep core" "run 'tmux switch-client -t core'" "run 'tmuxinator start core'"
bind -n ≈ if-shell "tmux ls | grep coding-exercise" "run 'tmux switch-client -t coding-exercise'" "run 'tmuxinator start coding-exercise'"
bind -n å if-shell "tmux ls | grep handbook" "run 'tmux switch-client -t handbook'" "run 'tmuxinator start handbook'"
bind -n † if-shell "tmux ls | grep intellij" "run 'tmux switch-client -t intellij'" "run 'tmuxinator start intellij'"
bind -n ß if-shell "tmux ls | grep sourcery" "run 'tmux switch-client -t sourcery'" "run 'tmuxinator start sourcery'"
bind -n √ if-shell "tmux ls | grep vscode" "run 'tmux switch-client -t vscode'" "run 'tmuxinator start vscode'"
bind -n ∑ if-shell "tmux ls | grep website" "run 'tmux switch-client -t website'" "run 'tmuxinator start website'"
bind -n ø if-shell "tmux ls | grep notes" "run 'tmux switch-client -t notes'" "run 'tmuxinator start notes'"

# Directional splits (vim-style, matches ghostty)
bind h split-window -hb -c "#{pane_current_path}"
bind j split-window -v  -c "#{pane_current_path}"
bind k split-window -vb -c "#{pane_current_path}"
bind l split-window -h  -c "#{pane_current_path}"

# Move panes in direction
bind H swap-pane -s '{left-of}'
bind J swap-pane -s '{down-of}'
bind K swap-pane -s '{up-of}'
bind L swap-pane -s '{right-of}'

# Move windows
bind-key -r "<" swap-window -t -1
bind-key -r ">" swap-window -t +1

# vi mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection

bind t new-window -c "#{pane_current_path}" "TERM=xterm tig status"

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH $XDG_CACHE_HOME/tmux/plugins
set -g @tpm_plugins ' \
  tmux-plugins/tpm \
  tmux-plugins/tmux-continuum \
  tmux-plugins/tmux-copycat \
  tmux-plugins/tmux-open \
  tmux-plugins/tmux-sensible \
  tmux-plugins/tmux-sessionist \
  tmux-plugins/tmux-yank \
  Morantron/tmux-fingers \
  seebi/tmux-colors-solarized \
'

# Plugin settings
set -g @continuum-restore 'on'
set -g @resurrect-dir $XDG_CACHE_HOME/tmux/resurrect
set -g @sessionist-alternate 's'  # Instead of S
set -g @sessionist-join-pane 'T' # Instead of t
set -g @sessionist-goto 'G'       # Instead of g
set -g @colors-solarized 'dark'


# auto install Tmux Plugin Manager and the plugins
if "test ! -d $XDG_CACHE_HOME/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm $XDG_CACHE_HOME/tmux/plugins/tpm && $XDG_CACHE_HOME/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run $XDG_CACHE_HOME/tmux/plugins/tpm/tpm
