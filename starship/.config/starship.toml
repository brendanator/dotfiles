"$schema" = 'https://starship.rs/config-schema.json'

format = """$username$hostname$directory$character"""
right_format = """$status$cmd_duration$git_state$git_status$git_branch"""
scan_timeout = 5

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](green)"
vimcmd_symbol = "[❮](red)"

[directory]
style = "bold blue"
truncation_length = 5
truncation_symbol = "…/"
fish_style_pwd_dir_length = 1

[git_branch]
format = "[$branch]($style)"
style = ""

[git_state]
format = " [$state($progress_current/$progress_total)]($style)"
style = "bright-red"

[git_status]
format = "$all_status "
staged = "[✚](green)"
modified = "[✱](blue)"
deleted = "[✖](red)"
renamed = "[➜](magenta)"
stashed = "[✭](cyan)"
untracked = "[◼](white)"
ahead = "[⬆$count](bright-magenta)"
behind = "[⬇$count](bright-magenta)"
diverged = "[⬆$ahead_count⬇$behind_count](bright-magenta)"
up_to_date = ""
typechanged = "[✱](blue)"
conflicted = "[═](yellow)"

[python]
disabled = true

[username]
show_always = false
format = "[$user]($style)"
style_user = "bright-red"
style_root = "bold red"

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "yellow"

[cmd_duration]
format = "[⏱ $duration ](yellow)"
min_time = 2000

[status]
disabled = false
format = "[✘$status ](red)"
