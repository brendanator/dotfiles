# Sets up a machine with `mise bootstrap`, run from this directory: packages, files,
# services, the firewall, the configs below, the login shell and mise's [tools].
# Docs: https://mise.jdx.dev/bootstrap.html
#
# What a machine gets beyond this file comes from its module, chosen by mise env:
#   mise.mac.toml     brew formulae and casks
#   mise.devbox.toml  apt packages, Tailscale, host firewall, the ~/.dotfiles clone
# setup.sh records the env in the gitignored .miserc.local.toml; a remote run
# takes it from the host's mise_env in the inventory (mise.local.toml).
#
# Configs: each top-level directory is a group, like a stow package: its tree
# mirrors $HOME, and each file git tracks in it is symlinked into place
# (manifest = "git"), from ~/.dotfiles (dotfiles.root) wherever mise runs.
# Docs: https://mise.jdx.dev/dotfiles.html
#
# A machine applies every group below unless its own (gitignored) mise.local.toml
# narrows the set:
#
#   [bootstrap]
#   dotfile_groups = ["zsh", "git", "nvim"]

[bootstrap.user]
login_shell = "/bin/zsh"

# `mise bootstrap remote` sends this directory to each host; keep this machine's
# own choices (env, groups, inventory) and state at home.
[bootstrap.remote]
exclude = [".miserc.local.toml", "mise.local.toml", ".state", "docs"]

[dotfiles]
# Claude Code's user settings: the repo owns only the keys in its file, so a
# machine's own keys (e.g. a private autoMode block) survive in ~/.claude/settings.json.
"~/.claude/settings.json/shared" = { source = "claude/.claude/settings.json", merge = true }

[dotfile_groups.atuin]
root = "atuin"
manifest = "git"

[dotfile_groups.bash]
root = "bash"
manifest = "git"

[dotfile_groups.bin]
root = "bin"
manifest = "git"

[dotfile_groups.bun]
root = "bun"
manifest = "git"

[dotfile_groups.claude]
root = "claude"
manifest = "git"
exclude = [".claude/settings.json"]  # merged by the [dotfiles] entry above

[dotfile_groups.direnv]
root = "direnv"
manifest = "git"

[dotfile_groups.gh]
root = "gh"
manifest = "git"

[dotfile_groups.ghostty]
root = "ghostty"
manifest = "git"

[dotfile_groups.git]
root = "git"
manifest = "git"

[dotfile_groups.graphite]
root = "graphite"
manifest = "git"

[dotfile_groups.karabiner]
root = "karabiner"
manifest = "git"

# Karabiner saves by writing a new file and renaming it over the old one, which
# replaces a symlink to the file itself. Link the whole folder on macOS instead;
# Linux boxes have no Karabiner and skip it.
[dotfile_groups.karabiner.entries]
"~/.config/karabiner" = { mode = "symlink", variants = [{ os = "macos", target = "~/.config/karabiner" }] }

[dotfile_groups.lazygit]
root = "lazygit"
manifest = "git"

[dotfile_groups.mise]
root = "mise"
manifest = "git"

[dotfile_groups.npm]
root = "npm"
manifest = "git"

[dotfile_groups.nvim]
root = "nvim"
manifest = "git"

[dotfile_groups.pgcli]
root = "pgcli"
manifest = "git"

[dotfile_groups.pnpm]
root = "pnpm"
manifest = "git"

[dotfile_groups.readline]
root = "readline"
manifest = "git"

[dotfile_groups.ripgrep]
root = "ripgrep"
manifest = "git"

[dotfile_groups.starship]
root = "starship"
manifest = "git"

[dotfile_groups.tmux]
root = "tmux"
manifest = "git"

[dotfile_groups.tmuxinator]
root = "tmuxinator"
manifest = "git"

[dotfile_groups.uv]
root = "uv"
manifest = "git"

[dotfile_groups.zed]
root = "zed"
manifest = "git"

[dotfile_groups.zsh]
root = "zsh"
manifest = "git"

[dotfile_groups.zsh.entries]
"~/.config/zsh/.zprezto" = { mode = "symlink" }  # submodule: link it whole, not file by file
