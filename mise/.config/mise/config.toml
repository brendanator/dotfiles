[tools]
1password-cli = "latest"
age = "latest"
ast-grep = "latest"
atuin = "latest"
bat = "latest"
btop = { version = "latest", os = ["linux"] }  # aqua ships no macOS build; brew keeps btop on the Mac
"github:aldanial/cloc" = "v2.08"
cargo-binstall = "latest"
codex = "latest"
eza = "0.23.4"
fnox = "latest"
gh = "latest"
hcloud = "latest"
jq = "latest"
lazygit = "latest"
mkcert = "latest"
neovim = "latest"
ripgrep = "latest"
sccache = "latest"
starship = "latest"
tiny = "latest"
usage = "latest"
zoxide = "latest"
node = "lts"
uv = "latest"
fzf = "latest"

[settings]
experimental = true
minimum_release_age = "7d"  # only install versions released more than 7 days ago
env_cache = true
quiet = false

[settings.pipx]
uvx = true

[settings.python]
compile = false

[env]
RUSTC_WRAPPER = "sccache"  # share rustc results across worktrees; each keeps its own target/
PIPENV_VENV_IN_PROJECT = 0
PYTHONPYCACHEPREFIX = "{{ xdg_cache_home }}/pycache{{ cwd }}"
